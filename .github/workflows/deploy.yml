name: Deploy NEBULA OS → GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Проверка графа ES-модулей и путей
        run: node scripts/check-modules.mjs

      - name: Синтаксис всех модулей
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > package.json
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          rm -f package.json
          node --check sw.js
          echo "Синтаксис OK"

      - name: Проверка manifest.webmanifest
        run: |
          node -e "const m=JSON.parse(require('node:fs').readFileSync('manifest.webmanifest','utf8'));if(!m.name||!m.start_url||!m.icons?.length)throw new Error('manifest неполный');console.log('manifest OK:',m.name)"

      - name: Версия едина во всех источниках
        id: ver
        run: |
          set -euo pipefail
          V=$(grep -oP "export const VERSION='\K[^']+" js/core/version.js)
          S=$(grep -oP "const VERSION = '\K[^']+" sw.js)
          echo "version.js=$V  sw.js=$S"
          [ "$V" = "$S" ] || { echo "::error::VERSION в sw.js не совпадает с version.js"; exit 1; }
          grep -q "NEBULA OS $V" index.html || { echo "::error::title в index.html не совпадает с версией"; exit 1; }
          grep -q "OS · $V" index.html || { echo "::error::boot-sub в index.html не совпадает с версией"; exit 1; }
          grep -q "NEBULA OS $V" 404.html || { echo "::error::404.html не совпадает с версией"; exit 1; }
          grep -q "версия-$V-" README.md || { echo "::error::бейдж версии в README не совпадает"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Версия $V согласована во всех файлах"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Сборка статического сайта
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html manifest.webmanifest sw.js _site/
          cp -R css js icons _site/
          touch _site/.nojekyll

          SHORT="${GITHUB_SHA::7}"
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          sed -i "s/__BUILD_ID__/${SHORT}/g" _site/sw.js
          sed -i "s|</head>|<meta name=\"nebula-build\" content=\"${SHORT} · ${STAMP}\"></head>|" _site/index.html

          find _site -name '*.map' -delete
          echo "Собрано файлов: $(find _site -type f | wc -l)"
          du -sh _site

      - name: Штампы сборки проставлены
        run: |
          set -euo pipefail
          if grep -q '__BUILD_ID__' _site/sw.js; then
            echo "::error::в sw.js остался placeholder __BUILD_ID__"; exit 1
          fi
          grep -q 'name="nebula-build"' _site/index.html || { echo "::error::в index.html нет метки сборки"; exit 1; }
          echo "sw.js:  $(grep -m1 'const BUILD_ID' _site/sw.js)"
          echo "html:   $(grep -o '<meta name="nebula-build"[^>]*>' _site/index.html)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Итог
        run: |
          {
            echo "### 🛸 NEBULA OS ${{ needs.build.outputs.version }} опубликована"
            echo ""
            echo "- Адрес: ${{ steps.deployment.outputs.page_url }}"
            echo "- Коммит: \`${GITHUB_SHA::7}\`"
            echo "- Кэш воркера: \`nebula-app-${{ needs.build.outputs.version }}-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"