name: Deploy NEBULA OS → GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Проверка графа ES-модулей, ресурсов и README
        run: node scripts/check-modules.mjs

      - name: Синтаксис всех модулей
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > package.json
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          rm -f package.json
          node --check sw.js
          echo "Синтаксис OK"

      - name: Проверка manifest.webmanifest
        run: |
          node -e "const m=JSON.parse(require('node:fs').readFileSync('manifest.webmanifest','utf8'));if(!m.name||!m.start_url||!m.icons?.length)throw new Error('manifest неполный');console.log('manifest OK:',m.name)"

      - name: Версия и сборка едины во всех источниках
        id: ver
        run: |
          set -euo pipefail
          V=$(grep -oP "export const VERSION='\K[^']+" js/core/version.js)
          B=$(grep -oP "export const BUILD='\K[^']+" js/core/version.js)
          C=$(grep -oP "export const CODENAME='\K[^']+" js/core/version.js)
          S=$(grep -oP "const VERSION = '\K[^']+" sw.js)
          echo "version.js: $V «$C» · сборка $B"
          echo "sw.js:      $S"
          fail(){ echo "::error::$1"; exit 1; }
          [ "$V" = "$S" ] || fail "VERSION в sw.js не совпадает с version.js"
          grep -q "export const RUNNING_BUILD='__BUILD_ID__'" js/core/version.js || fail "в version.js нет placeholder RUNNING_BUILD"
          grep -q "NEBULA OS $V" index.html            || fail "title в index.html не совпадает с версией"
          grep -q "OS · $V" index.html                 || fail "boot-sub в index.html не совпадает с версией"
          grep -q "NEBULA OS $V" 404.html              || fail "404.html не совпадает с версией"
          grep -q "$V «$C»" docs/banner.svg            || fail "баннер не совпадает с версией"
          grep -q "$V «$C»" docs/badge-version.svg     || fail "бейдж версии не совпадает с версией"
          grep -q "$B" docs/badge-build.svg            || fail "бейдж сборки не совпадает с датой сборки"
          grep -q "docs/badge-version.svg" README.md   || fail "README не ссылается на бейдж версии"
          grep -q "docs/badge-build.svg" README.md     || fail "README не ссылается на бейдж сборки"
          grep -q "nebula-app-$V-" README.md           || fail "имя кэша в README не совпадает с версией"
          grep -q "### $V «$C» · $B" README.md         || fail "в README нет записи истории для $V «$C» · $B"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "Версия $V «$C» · сборка $B согласована во всех файлах"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Сборка статического сайта
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html manifest.webmanifest sw.js _site/
          cp -R css js icons _site/
          touch _site/.nojekyll

          SHORT="${GITHUB_SHA::7}"
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # один и тот же SHA уходит и в воркер, и в исполняемый модуль версии:
          # только так вкладка знает, какая сборка в ней реально работает
          sed -i "s/__BUILD_ID__/${SHORT}/g" _site/sw.js _site/js/core/version.js
          sed -i "s|</head>|<meta name=\"nebula-build\" content=\"${SHORT} · ${STAMP}\"></head>|" _site/index.html

          find _site -name '*.map' -delete
          echo "Собрано файлов: $(find _site -type f | wc -l)"
          du -sh _site

      - name: Штампы сборки проставлены
        run: |
          set -euo pipefail
          if grep -q '__BUILD_ID__' _site/sw.js _site/js/core/version.js; then
            echo "::error::placeholder __BUILD_ID__ остался в sw.js или version.js"; exit 1
          fi
          grep -q 'name="nebula-build"' _site/index.html || { echo "::error::в index.html нет метки сборки"; exit 1; }
          echo "sw.js:      $(grep -m1 'const BUILD_ID' _site/sw.js)"
          echo "version.js: $(grep -m1 'RUNNING_BUILD' _site/js/core/version.js)"
          echo "html:       $(grep -o '<meta name="nebula-build"[^>]*>' _site/index.html)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Итог
        run: |
          {
            echo "### 🛸 NEBULA OS ${{ needs.build.outputs.version }} опубликована"
            echo ""
            echo "- Адрес: ${{ steps.deployment.outputs.page_url }}"
            echo "- Сборка: \`${{ needs.build.outputs.build }}\`"
            echo "- Коммит: \`${GITHUB_SHA::7}\`"
            echo "- Кэш воркера: \`nebula-app-${{ needs.build.outputs.version }}-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"