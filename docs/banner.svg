    </linearGradient>
    <radialGradient id="blobV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c6bff" stop-opacity=".55"/><stop offset="60%" stop-color="#7c6bff" stop-opacity=".16"/><stop offset="100%" stop-color="#7c6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".42"/><stop offset="60%" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
