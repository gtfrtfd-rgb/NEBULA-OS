      <g><rect x="488" y="272" width="118" height="38" rx="12" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".42"/><text x="547" y="296" fill="#8fe6f4" text-anchor="middle">IndexedDB</text></g>
